<html lang="zh-Hant">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#0a080e">
		<meta name="description" content="夜影傭兵團 Nightshade Mercenaries — 戰棋 × 技能卡牌">
		<title>夜影傭兵團 Nightshade Mercenaries</title>
		<style>
/* 配色跟 scripts/ui.gd 的常數對齊,載入畫面與遊戲內才像同一款遊戲。 */
:root {
	--ink: #0a080e;
	--panel: #1a1522;
	--edge: #362c46;
	--gold: #d9a83a;
	--gold-dim: #8d6f22;
	--text: #ece4d8;
	--text-dim: #9a9088;
	--text-faint: #6b6270;
	--blood: #c9503f;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: var(--text);
	background-color: var(--ink);
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: fixed;
	inset: 0;
	z-index: 10;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	padding: 24px;
	box-sizing: border-box;
	background-color: var(--ink);
	font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Hiragino Sans", "Source Han Sans TC", system-ui, sans-serif;
	transition: opacity .45s ease;
}

/* 主選單左上角那道金色光暈,搬到載入畫面上。 */
#status::before {
	content: "";
	position: absolute;
	inset: 0;
	background: radial-gradient(900px 620px at 22% 14%, rgba(217, 168, 58, .13), transparent 62%);
	pointer-events: none;
}

#status.done {
	opacity: 0;
	pointer-events: none;
}

#shell {
	position: relative;
	width: min(560px, 100%);
	text-align: center;
}

#kicker {
	color: var(--gold-dim);
	font-size: 12px;
	letter-spacing: .42em;
	text-indent: .42em;
	margin-bottom: 14px;
}

#title {
	color: var(--gold);
	font-size: clamp(34px, 7vw, 54px);
	font-weight: 700;
	letter-spacing: .12em;
	text-indent: .12em;
	line-height: 1.15;
	margin: 0 0 10px;
	text-shadow: 0 0 26px rgba(217, 168, 58, .28);
}

#tagline {
	color: var(--text-dim);
	font-size: 13px;
	letter-spacing: .08em;
	margin-bottom: 34px;
}

#bar {
	position: relative;
	height: 6px;
	border-radius: 3px;
	background: #171220;
	border: 1px solid var(--edge);
	overflow: hidden;
}

#fill {
	position: absolute;
	inset: 0 auto 0 0;
	width: 0%;
	background: linear-gradient(90deg, var(--gold-dim), var(--gold));
	border-radius: 3px;
	transition: width .25s ease;
}

/* 拿不到位元組數時(伺服器沒給 Content-Length)退回跑馬燈,總比停在 0% 好。 */
#bar.indeterminate #fill {
	width: 34%;
	animation: sweep 1.35s ease-in-out infinite;
	transition: none;
}

@keyframes sweep {
	0%   { transform: translateX(-110%); }
	100% { transform: translateX(320%); }
}

#line {
	display: flex;
	justify-content: space-between;
	align-items: baseline;
	gap: 12px;
	margin-top: 12px;
	font-size: 13px;
	color: var(--text-dim);
	font-variant-numeric: tabular-nums;
}

#pct {
	color: var(--gold);
	font-size: 15px;
	font-weight: 600;
}

#hint {
	margin-top: 26px;
	font-size: 12px;
	line-height: 1.75;
	color: var(--text-faint);
}

#enter {
	display: none;
	margin: 26px auto 0;
	padding: 13px 46px;
	background: transparent;
	color: var(--gold);
	border: 1px solid var(--gold-dim);
	border-radius: 4px;
	font: inherit;
	font-size: 16px;
	letter-spacing: .22em;
	text-indent: .22em;
	cursor: pointer;
	transition: background-color .2s ease, color .2s ease, border-color .2s ease;
}

#enter:hover, #enter:focus-visible {
	background: var(--gold);
	border-color: var(--gold);
	color: #241a05;
	outline: none;
}

#status.ready #bar, #status.ready #line, #status.ready #hint {
	display: none;
}

#status.ready #enter {
	display: block;
}

#notice {
	display: none;
	margin-top: 26px;
	padding: 16px 18px;
	text-align: left;
	background: #241419;
	border: 1px solid var(--blood);
	border-radius: 6px;
	color: #e8cfc9;
	font-size: 13px;
	line-height: 1.6;
	max-height: 40vh;
	overflow: auto;
}

#status.failed #bar, #status.failed #line, #status.failed #hint, #status.failed #enter {
	display: none;
}

#status.failed #notice {
	display: block;
}

/* 直向手機把 3D 棋盤壓成一條,先請玩家轉橫。桌機不會踩到這條。 */
#rotate {
	display: none;
	position: fixed;
	inset: 0;
	z-index: 20;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 14px;
	background: var(--ink);
	color: var(--text-dim);
	font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
	font-size: 15px;
	letter-spacing: .1em;
}

#rotate span {
	font-size: 34px;
	color: var(--gold);
}

@media (orientation: portrait) and (max-width: 900px) {
	#rotate { display: flex; }
}

		document.head.appendChild(link);
	});
}());
		</script>
		<script>
// 抓住 Godot 建立的 AudioContext。瀏覽器的自動播放限制讓它一出生就是 suspended,
// 而 Godot 只在「畫布收到輸入」時才 resume——玩家按的「進入遊戲」是蓋在畫布上的
// HTML 按鈕,那一下傳不到畫布,於是主選單的 BGM 一路啞著(kc 2026-08-02 回報)。
// 這裡把 context 留下來,按鈕按下去時自己 resume,音樂就從主選單第一秒開始。
(function () {
	const Native = window.AudioContext || window.webkitAudioContext;
	if (!Native) {
		return;
	}
	window.__godotAudioContexts = [];
	const Patched = function (...args) {
		const ctx = new Native(...args);
		window.__godotAudioContexts.push(ctx);
		return ctx;
	};
	Patched.prototype = Native.prototype;
	window.AudioContext = Patched;
	window.webkitAudioContext = Patched;
}());
		</script>
	</head>
	<body>
		<canvas id="canvas">
			你的瀏覽器不支援 canvas。
		</canvas>

		<noscript>
			這個遊戲需要 JavaScript 才能執行。
		</noscript>

		<div id="status">
			<div id="shell">
				<div id="kicker">NIGHTSHADE MERCENARIES</div>
				<h1 id="title">夜影傭兵團</h1>
				<div id="tagline">戰棋 × 技能卡牌</div>

				<div id="bar" class="indeterminate" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="載入進度">
					<div id="fill"></div>
				</div>
				<div id="line">
					<span id="stage">連線中</span>
					<span><span id="size"></span> <span id="pct">0%</span></span>
				</div>

				<div id="hint">
					第一次進來要下載<span id="hint-size"> </span>遊戲資源,一般寬頻十幾秒。<br>
					載完之後瀏覽器會快取,下一次開就快了。
				</div>

				<button id="enter" type="button">進 入 遊 戲</button>
				<div id="notice"></div>
			</div>
		</div>

		<div id="rotate">
			<span>⟳</span>
			<div>請把手機轉成橫向</div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":35397668,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

// 載完之後要不要停在「進入遊戲」那顆鈕。true = 直接進場,但瀏覽器的自動播放限制
// 會讓 BGM 一直啞到玩家第一次點畫面為止,所以預設留著這顆鈕當那一下互動。
const AUTO_START = false;

(function () {
	const statusOverlay = document.getElementById('status');
	const bar = document.getElementById('bar');
	const fill = document.getElementById('fill');
	const stageLabel = document.getElementById('stage');
	const sizeLabel = document.getElementById('size');
	const pctLabel = document.getElementById('pct');
	const enterButton = document.getElementById('enter');
	const notice = document.getElementById('notice');
	const canvas = document.getElementById('canvas');

	let initializing = true;

	function mb(bytes) {
		return (bytes / 1048576).toFixed(1);
	}

	// 提示裡的容量從 config 的 fileSizes 現算,匯出變胖變瘦都不用回來改字。
	(function () {
		const sizes = GODOT_CONFIG['fileSizes'] || {};
		let total = 0;
		Object.keys(sizes).forEach((key) => {
			total += sizes[key];
		});
		if (total > 0) {
			document.getElementById('hint-size').textContent = '約 ' + Math.round(total / 1048576) + ' MB 的';
		}
	}());

	function setProgress(current, total) {
		if (!(current > 0 && total > 0)) {
			bar.classList.add('indeterminate');
			bar.removeAttribute('aria-valuenow');
			return;
		}
		const ratio = Math.min(current / total, 1);
		const pct = Math.floor(ratio * 100);
		bar.classList.remove('indeterminate');
		fill.style.width = pct + '%';
		bar.setAttribute('aria-valuenow', String(pct));
		pctLabel.textContent = pct + '%';
		sizeLabel.textContent = mb(current) + ' / ' + mb(total) + ' MB ·';
		// 下載完到引擎真的起來還有解壓跟編譯 WASM 的幾秒,不換句話會被當成卡住。
		stageLabel.textContent = ratio >= 1 ? '解壓與初始化' : '下載遊戲資源';
	}

	function hideOverlay() {
		if (!initializing) {
			return;
		}
		initializing = false;
		// 玩家真正的第一下手勢在這裡,趁這一下把音訊叫醒(見 head 裡的 AudioContext 包裝)。
		resumeAudio();
		statusOverlay.classList.add('done');
		setTimeout(() => statusOverlay.remove(), 500);
		canvas.focus();
	}

	function showReady() {
		if (AUTO_START) {
			hideOverlay();
			return;
		}
		stageLabel.textContent = '準備完成';
		statusOverlay.classList.add('ready');
		enterButton.focus();
	}

	// 沒有這一下,BGM 會啞到玩家碰巧點到畫布為止;AUTO_START 的情況下則是永遠不響。
	function resumeAudio() {
		(window.__godotAudioContexts || []).forEach((ctx) => {
			if (ctx.state !== 'running') {
				ctx.resume().catch(() => {});
			}
		});
	}

	// AUTO_START 或任何繞過按鈕的路徑,補一層:第一次碰畫面就叫醒音訊。
	['pointerdown', 'keydown', 'touchstart'].forEach((evt) => {
		window.addEventListener(evt, resumeAudio, { once: false, passive: true });
	});

	enterButton.addEventListener('click', hideOverlay);

	function displayFailureNotice(err) {
		console.error(err);
		let message;
		if (err instanceof Error) {
			message = err.message;
		} else if (typeof err === 'string') {
			message = err;
		} else {
			message = '發生了未知的錯誤。';
		}
		notice.textContent = '';
		message.split('\n').forEach((line) => {
			notice.appendChild(document.createTextNode(line));
			notice.appendChild(document.createElement('br'));
		});
		statusOverlay.classList.add('failed');
		statusOverlay.classList.remove('ready');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			displayFailureNotice('這個瀏覽器少了執行遊戲需要的功能:\n' + missing.join('\n') + '\n\n請改用較新版的 Chrome / Edge / Firefox / Safari。');
		}
	} else {
		engine.startGame({
			'onProgress': setProgress,
		}).then(showReady, displayFailureNotice);
	}
}());
		</script>
	</body>
